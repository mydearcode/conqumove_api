databases:
  - name: conqumove-db
    plan: starter

services:
  - type: web
    name: conqumove-api
    runtime: ruby
    plan: starter
    buildCommand: ./bin/render-build.sh
    preDeployCommand: bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: conqumove-db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: conqumove-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: conqumove-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: conqumove-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MASTER_KEY
        sync: false
      - key: CONQUMOVE_PUBLIC_BASE_URL
        sync: false
      - key: CONQUMOVE_PUBLIC_CABLE_URL
        sync: false
